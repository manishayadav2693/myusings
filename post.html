<style>
/* VOICE calm long reading, an essay set like a good literary journal
   IDEA a printed essay: quiet section list in the margin, one generous column, numbered parts
   PICTURE the watercolour poppy, very faint, standing behind the page like a watermark
   COLOUR white, ink, scarlet only for small marks, the post's topic colour for its dot
   TYPE 'Cormorant Garamond' for title, parts and quotes + Geist 18px text
   LAYOUT desktop: sticky section list on the left, reading column beside it, poppy faint on the right; phone: one column with a thin progress line */
.mark2{position:fixed;right:3vw;bottom:3vh;height:min(260px,30vh);width:auto;opacity:.12;pointer-events:none;z-index:0}
.page{position:relative;z-index:1;display:grid;grid-template-columns:200px minmax(0,640px);gap:0 72px;padding:0 max(5vw,24px)}
.toc{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;gap:2px}
.toc a{display:flex;gap:12px;align-items:center;padding:6px 0;font-size:14px;line-height:1.3;color:var(--soft);text-decoration:none}
.toc a::before{content:"";height:1px;width:12px;background:currentColor;flex:none;opacity:.5;transition:width .35s ease,opacity .35s ease}
.toc a:hover{color:var(--ink)}
.toc a:hover::before{width:22px;opacity:1}
.toc a.on{color:var(--ink)}
.toc a.on::before{width:32px;opacity:1;background:var(--scarlet)}
article{padding:clamp(48px,10vh,110px) 0 40px}
.back{display:inline-flex;gap:8px;align-items:center;font-size:15px;color:var(--soft);text-decoration:none;padding:8px 0;margin-bottom:28px}
.back:hover{color:var(--ink)}
.kicker{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--soft);margin:0 0 18px}
article h1{font-size:clamp(44px,5.4vw,68px);font-weight:360;line-height:1.02;letter-spacing:-.025em}
.dek{font:400 20px/1.5 Geist,system-ui,sans-serif;color:var(--ink);margin:26px 0 18px;max-width:34em}
.by{font-size:14px;color:var(--soft);margin:0;padding-bottom:36px;border-bottom:1px solid var(--hair)}
.by b{font-weight:500;color:var(--ink)}
.body{padding-top:36px}
.body p,.body li{font-size:18px;line-height:1.78}
.body p{margin:0 0 1.15em}
.body em{font-style:italic}
.part{margin:3.2em 0 1em;scroll-margin-top:40px}
.part .n{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--soft);margin-bottom:12px}
.part .n::before{content:"";width:22px;height:1.5px;background:var(--scarlet)}
.part h2{font-size:clamp(34px,3.4vw,44px);font-weight:400;line-height:1.1}
.body strong{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:20px}
.body ul{padding-left:1.2em;margin:0 0 1.3em}
.body blockquote{margin:2.4em 0;padding:0}
.body blockquote p{font:400 clamp(26px,2.8vw,34px)/1.28 'Cormorant Garamond',Georgia,serif;letter-spacing:-.015em;margin:0;text-wrap:balance}
.body blockquote::before{content:"";display:block;width:22px;height:1.5px;background:var(--scarlet);margin-bottom:16px}
.body figure{margin:2.4em 0}
.body figure .art{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.body figure .art.one{grid-template-columns:minmax(0,1fr)}
.body figure svg{width:100%;height:auto;display:block}
.body figcaption{font-size:14px;color:var(--soft);margin-top:10px;border-top:1px solid var(--hair);padding-top:10px}
.end{border-top:1px solid var(--hair);margin-top:48px;padding-top:28px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.end span{font-size:14px;color:var(--soft)}
.more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:36px 0 80px}
.more a{display:grid;gap:6px;padding:20px 0;border-top:1px solid var(--ink);text-decoration:none}
.more small{font-size:13px;color:var(--soft)}
.more strong{font:400 22px/1.2 'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em}
.more a:hover strong{color:var(--violet)}
.more a.nx{text-align:right;grid-column:2}
.bar{position:fixed;top:0;left:0;height:3px;background:var(--scarlet);width:0;z-index:5;display:none}
.top,footer{position:relative;z-index:1;background:transparent}
@media(max-width:900px){.page{grid-template-columns:minmax(0,1fr)}.toc{display:none}.bar{display:block}.mark2{height:160px;opacity:.08}.more{grid-template-columns:minmax(0,1fr)}.more a.nx{text-align:left;grid-column:auto}}
@media(min-width:1300px){.page{grid-template-columns:220px minmax(0,660px);gap:0 96px;padding-left:max(6vw,24px)}}
</style>

<script>
{
const P=window.POSTS,T=window.TOPICS,$=id=>document.getElementById(id);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const dot=c=>{const d=el('i','dot');d.style.setProperty('--c',c);return d};
/* *words* become italics; everything else stays plain text */
const rich=(tag,txt,cls)=>{const e=el(tag,cls);String(txt).split('*').forEach((s,i)=>{if(!s)return;e.append(i%2?el('em',null,s):document.createTextNode(s))});return e};
const svgEl=()=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('aria-hidden','true');return s};
const fig=b=>{const f=el('figure'),art=el('div','art');
  if(b.fig==='matrix'){art.classList.add('one');const s=svgEl();s.setAttribute('role','img');s.setAttribute('aria-label','A 2x2 of queue-breakers: awareness of others against entitlement. Aware and less entitled: the Side-Eye Specialist. Aware and more entitled: the Aristocrat, who waits for the line to part, and the Strategist, who builds her own. Unaware and less entitled: the Lost One. Unaware and more entitled: the Drifter.');art.append(s);MY.matrix(s)}
  else if(b.fig==='stages'){[.18,.55,1].forEach((p,i)=>{const s=svgEl();art.append(s);MY.poppy(s,{p,seed:20+i})})}
  else{art.classList.add('one');const s=svgEl();art.append(s);MY.swatches(s,['#8fa3c9','#3faa4a','#f2c14e','#ff4f9a','#8b45c9','#9fb3c8','#2f9e5b','#f2210f','#e9a23b','#c94f9a'])}
  f.append(art,el('figcaption',null,b.cap));return f};
const fmtDate=p=>{const d=new Date(p.iso+'T00:00:00');return isNaN(d)?p.date:d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})};
let parts=[];
const render=()=>{
  const slug=location.hash.slice(1);let i=P.findIndex(p=>p.slug===slug);if(i<0)i=0;const p=P[i],c=T[p.topic]||'#f2210f';
  document.title=p.title+' · MYusings';
  const k=$('kicker');k.replaceChildren();if(p.kind)k.append(el('span',null,(p.kind||'Musing')+(p.no?' '+String(p.no).padStart(3,'0'):'')));
  $('title').textContent=p.title;$('dek').textContent=p.dek||p.excerpt;
  const heads=p.body.filter(b=>b.h).length;
  const by=$('by');by.replaceChildren('By ',el('b',null,'Manisha Yadav'),' · '+fmtDate(p)+' · '+p.mins+' min read'+(heads?' · '+heads+' parts':''));
  let n=0;parts=[{id:'start',label:'Start'}];
  const body=$('body');body.replaceChildren(...p.body.map(b=>{
    if(b.a){const e=el('p');e.append(el('strong',null,b.a+'. '));rich('span',b.p).childNodes.forEach(x=>e.append(x.cloneNode(true)));return e}
    if(b.p)return rich('p',b.p);
    if(b.h){n++;const id='part-'+n,d=el('div','part');d.id=id;d.append(el('p','n',String(n).padStart(2,'0')+' / '+String(heads).padStart(2,'0')),el('h2',null,b.h));parts.push({id,label:b.h});return d}
    if(b.q){const q=el('blockquote');q.append(rich('p',b.q));return q}
    if(b.ul){const u=el('ul');b.ul.forEach(t=>u.append(rich('li',t)));return u}
    if(b.fig)return fig(b);return el('p')}));
  $('post').querySelector('.kicker').id='kicker';$('title').setAttribute('data-part','start');
  $('toc').replaceChildren(...parts.map((x,j)=>{const a=el('a',null,x.label);a.href='#'+p.slug;a.addEventListener('click',e=>{e.preventDefault();const t=j?$(x.id):$('title');t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});return a}));
  $('reply').href='mailto:hello@myusings.com?subject='+encodeURIComponent('Re: '+p.title);
  const prev=P[i+1],next=P[i-1],m=[];
  if(prev){const a=el('a');a.href='post.html#'+prev.slug;a.append(el('small',null,'Earlier'),el('strong',null,prev.title));m.push(a)}
  if(next){const a=el('a','nx');a.href='post.html#'+next.slug;a.append(el('small',null,'Newer'),el('strong',null,next.title));m.push(a)}
  $('more').replaceChildren(...m);update()};
const update=()=>{const a=$('post').getBoundingClientRect(),h=a.height-innerHeight*.6,pr=Math.max(0,Math.min(1,(-a.top+innerHeight*.2)/Math.max(1,h)));$('bar').style.width=(pr*100).toFixed(1)+'%';
  let on=0;parts.forEach((x,j)=>{if(j&&$(x.id).getBoundingClientRect().top<innerHeight*.35)on=j});[...$('toc').children].forEach((a,j)=>a.classList.toggle('on',j===on))};
let tk=false;addEventListener('scroll',()=>{if(!tk){tk=true;requestAnimationFrame(()=>{tk=false;update()})}},{passive:true});
addEventListener('resize',update);
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
render();
}
</script>
