<style>
/* VOICE quiet contents page
   LAYOUT year column on the left, one ruled row per musing: title, one-line excerpt, reading time
   TYPE 'Cormorant Garamond' for titles and the year, Geist for everything else */
.wrap{max-width:1180px;margin:0 auto;padding:0 max(5vw,16px)}






.year{padding-top:clamp(40px,7vh,72px);display:grid;grid-template-columns:200px minmax(0,1fr);gap:0 56px;padding-bottom:56px}
.year h2{font-size:clamp(40px,4.4vw,56px);font-weight:400;position:sticky;top:24px;align-self:start}
.year h2 small{display:block;margin-top:8px;font:400 14px/1 Geist,system-ui,sans-serif;letter-spacing:0;color:var(--soft)}
.list{list-style:none;margin:0;padding:0}
.row{position:relative;padding:26px 0 28px;border-bottom:1px solid var(--hair)}
.row:first-child{padding-top:6px}
.row h3{font-size:29px;font-weight:500;line-height:1.25}
.row h3 a{text-decoration:none}
.row h3 a::after{content:"";position:absolute;inset:0}
.row:hover h3{color:var(--scarlet)}
.row p{margin:8px 0 0;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{margin-top:8px;font-size:14px;color:var(--soft)}
.new{margin-left:12px;font:400 14px/1 Geist,system-ui,sans-serif;color:var(--scarlet);white-space:nowrap;vertical-align:middle}
.new::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--scarlet);margin-right:7px;vertical-align:1px}
@media(max-width:860px){
.year{grid-template-columns:minmax(0,1fr)}.year h2{position:static;margin-bottom:18px}.row p{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
</style>
</head>

<script src="posts.js"></script>
<script>
{
const P=window.POSTS;
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
document.getElementById('count').textContent=P.length===1?'One musing so far.':P.length+' musings so far.';
const by={};P.forEach(p=>{const y=p.iso.slice(0,4);(by[y]=by[y]||[]).push(p)});
document.getElementById('years').replaceChildren(...Object.keys(by).sort().reverse().map(y=>{
  const sec=el('section','year');const h=el('h2',null,y);h.append(el('small',null,by[y].length+(by[y].length===1?' musing':' musings')));
  const ol=el('ol','list');
  by[y].forEach(p=>{const li=el('li','row');const h3=el('h3');const a=el('a',null,p.title);a.href='post.html#'+p.slug;h3.append(a);
    li.append(h3,el('p',null,p.excerpt),el('div','meta',p.mins+' min read'));ol.append(li)});
  sec.append(h,ol);return sec}));
}
</script>
