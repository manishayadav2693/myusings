<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Weekly Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    color: #1c1917;
    background:
      radial-gradient(1200px 600px at 10% -10%, #fef3c7 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #ecfeff 0%, transparent 50%),
      #faf7f2;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Cormorant Garamond', ui-serif, Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; }
  .uppercase-label { text-transform: uppercase; letter-spacing: 0.22em; font-size: 10px; color: #78716c; }

  /* layout */
  header.topbar {
    padding: 32px 32px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(231, 229, 228, 0.7);
  }
  .week-title { font-size: 30px; margin-top: 4px; color: #1c1917; }
  .nav-btn {
    width: 36px; height: 36px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: rgba(231, 229, 228, 0.6); }
  .pill {
    padding: 6px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em;
    border-radius: 999px; border: 1px solid #d6d3d1; transition: background 0.15s;
    color: #44403c;
  }
  .pill:hover { background: white; }
  .pill.active { background: #1c1917; color: #fafaf9; border-color: #1c1917; }
  .divider { width: 1px; height: 24px; background: #d6d3d1; margin: 0 8px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .seg {
    display: inline-flex; padding: 2px;
    border: 1px solid #d6d3d1; border-radius: 999px;
    background: rgba(255,255,255,0.5);
  }
  .seg-btn {
    padding: 4px 10px; font-size: 11px; letter-spacing: 0.1em;
    border-radius: 999px; color: #57534e; transition: background 0.15s, color 0.15s;
    min-width: 28px;
  }
  .seg-btn:hover { color: #1c1917; }
  .seg-btn.active { background: #1c1917; color: #fafaf9; }

  .layout { display: flex; }
  aside.backlog {
    width: 288px; flex-shrink: 0;
    border-right: 1px solid rgba(231, 229, 228, 0.7);
    padding: 20px;
    height: calc(100vh - 90px);
    overflow-y: auto;
    overflow-x: hidden;
  }
  main.board { flex: 1; padding: 20px; min-width: 0; }

  .week-grid { display: grid; grid-template-columns: repeat(var(--day-count, 5), 1fr); gap: 12px; }

  .day-col {
    border-radius: 12px; border: 1px solid rgba(231, 229, 228, 0.8);
    background: rgba(255, 255, 255, 0.5);
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    cursor: pointer;
    display: flex; flex-direction: column;
    /* Fixed height: viewport minus topbar/timeline; column scrolls internally */
    height: calc(100vh - 220px);
    min-height: 320px;
    overflow: hidden;
  }
  .day-col:hover { background: rgba(255, 255, 255, 0.8); }
  .day-col.active {
    background: white; border-color: rgba(28, 25, 23, 0.4);
    box-shadow: 0 8px 30px -12px rgba(0,0,0,0.15);
  }
  .day-head { padding: 12px 12px 8px; display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; }
  .day-num { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 24px; color: #292524; }
  .day-num.today { color: #b45309; }
  .day-tasks {
    padding: 0 8px 8px;
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    min-height: 0;        /* required so flex child can shrink and scroll */
    overflow-y: auto;     /* the scroll lives here */
    overflow-x: hidden;
  }
  .day-foot { padding: 8px 8px; flex-shrink: 0; border-top: 1px solid rgba(231, 229, 228, 0.6); background: inherit; }

  /* task card */
  .task {
    background: white; border: 1px solid #e7e5e4; border-radius: 8px;
    padding: 8px 10px; cursor: grab; transition: border-color 0.12s, opacity 0.12s;
    user-select: none;
  }
  .task:hover { border-color: #a8a29e; }
  .task:active { cursor: grabbing; }
  .task.done { opacity: 0.5; }
  .task-row { display: flex; align-items: flex-start; gap: 8px; }
  .check {
    margin-top: 2px; width: 16px; height: 16px; border-radius: 999px;
    border: 1px solid #a8a29e; background: transparent; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .check.done { background: #15803d; border-color: #15803d; }
  .check svg { width: 10px; height: 10px; stroke: white; stroke-width: 3; fill: none; }
  .task-title { font-size: 13px; line-height: 1.35; color: #292524; word-break: break-word; }
  .task-title.done { text-decoration: line-through; }
  .task-notes { font-size: 11px; color: #78716c; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
  }
  .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
  .meta-tiny { font-size: 10px; color: #78716c; display: inline-flex; align-items: center; gap: 2px; }

  /* inline subtasks (shown directly on the task card) */
  .inline-subs {
    list-style: none; padding: 0; margin: 8px 0 2px;
    display: flex; flex-direction: column; gap: 3px;
    border-left: 1px solid #e7e5e4; padding-left: 8px;
  }
  .inline-sub {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; line-height: 1.3; color: #57534e;
  }
  .inline-sub.done .inline-sub-title { text-decoration: line-through; color: #a8a29e; }
  .inline-sub-check {
    width: 12px; height: 12px; border-radius: 3px;
    border: 1px solid #a8a29e; background: transparent;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0; transition: all 0.12s;
  }
  .inline-sub-check:hover { border-color: #44403c; }
  .inline-sub-check.done { background: #15803d; border-color: #15803d; }
  .inline-sub-check svg { width: 8px; height: 8px; stroke: white; stroke-width: 4; fill: none; }
  .inline-sub-title { word-break: break-word; min-width: 0; }

  /* new task input */
  .new-task {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: rgba(255, 255, 255, 0.7);
    border: 1px solid #e7e5e4; border-radius: 8px;
    transition: border-color 0.15s;
  }
  .new-task:focus-within { border-color: #a8a29e; }
  .new-task input {
    flex: 1; background: transparent; border: none; font-size: 13px;
  }
  .new-task input::placeholder { color: #a8a29e; }

  /* timeline */
  .timeline {
    margin-top: 24px; background: rgba(255, 255, 255, 0.7);
    border: 1px solid #e7e5e4; border-radius: 16px; overflow: hidden;
  }
  .timeline-head {
    padding: 16px 20px 12px; border-bottom: 1px solid rgba(231,229,228,0.7);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .timeline-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 20px; color: #1c1917; }
  .unscheduled-row { display: flex; gap: 8px; align-items: center; max-width: 100%; overflow-x: auto; }
  .unscheduled-row .uppercase-label { flex-shrink: 0; }
  .pill-task {
    flex-shrink: 0; font-size: 12px; padding: 4px 8px;
    background: #f5f5f4; border: 1px solid #e7e5e4; border-radius: 4px;
    cursor: grab; white-space: nowrap;
  }
  .pill-task:hover { background: #e7e5e4; }
  .timeline-body {
    position: relative; padding: 16px 20px;
    max-height: 560px; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin; scrollbar-color: #d6d3d1 transparent;
  }
  .timeline-body::-webkit-scrollbar { width: 8px; }
  .timeline-body::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
  .now-line {
    position: absolute; left: 56px; right: 8px; height: 2px;
    background: #e11d48; z-index: 5; pointer-events: none;
  }
  .now-dot {
    position: absolute; left: -6px; top: -4px;
    width: 10px; height: 10px; border-radius: 999px;
    background: #e11d48;
  }
  .timeline-grid { position: relative; }
  .hour-row {
    position: absolute; left: 0; right: 0; border-top: 1px dashed #e7e5e4;
    display: flex; align-items: flex-start;
  }
  .hour-label {
    width: 56px; margin-top: -8px; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.15em; color: #a8a29e;
  }
  .event {
    position: absolute; left: 64px; right: 8px;
    background: white; border: 1px solid; border-left-width: 3px; border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
    box-shadow: 0 2px 6px -2px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .event-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .event-title { font-size: 13px; color: #292524; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event-meta { font-size: 10px; color: #78716c; margin-top: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .event .x-btn { opacity: 0; color: #a8a29e; transition: opacity 0.1s, color 0.1s; }
  .event:hover .x-btn { opacity: 1; }
  .event .x-btn:hover { color: #44403c; }
  .resize-handle {
    position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
    cursor: ns-resize; opacity: 0; transition: opacity 0.1s;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.05));
  }
  .event:hover .resize-handle { opacity: 1; }

  /* detail drawer */
  aside.detail {
    width: 384px; flex-shrink: 0;
    border-left: 1px solid rgba(231,229,228,0.7);
    background: rgba(255,255,255,0.9);
    padding: 24px; min-height: calc(100vh - 90px);
  }
  .detail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .detail-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { padding: 6px; color: #78716c; border-radius: 4px; transition: color 0.1s; }
  .icon-btn:hover { color: #1c1917; }
  .icon-btn.danger:hover { color: #be123c; }
  .detail-title {
    width: 100%; font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: 22px; background: transparent; border: none;
    border-bottom: 1px solid transparent; padding-bottom: 4px;
  }
  .detail-title:focus { border-bottom-color: #d6d3d1; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .grid-2 label.full { grid-column: 1 / -1; }
  .field-input, .field-select {
    width: 100%; font-size: 13px; background: transparent;
    border: 1px solid #e7e5e4; border-radius: 4px; padding: 6px 8px;
  }
  .field-input:focus, .field-select:focus { border-color: #a8a29e; }
  .color-row { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 4px; }
  .color-swatch {
    width: 20px; height: 20px; border-radius: 999px; border: 2px solid transparent;
    transition: border-color 0.1s;
  }
  .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; color: #78716c; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .section { margin-top: 20px; }
  textarea.notes {
    width: 100%; font-size: 13px; background: #fafaf9;
    border: 1px solid #e7e5e4; border-radius: 4px; padding: 8px;
    resize: vertical; min-height: 80px;
  }
  textarea.notes:focus { border-color: #a8a29e; }
  .subtask {
    display: flex; align-items: center; gap: 8px; padding: 2px 0;
  }
  .subtask input.title {
    flex: 1; font-size: 13px; background: transparent; border: none;
  }
  .subtask input.title.done { text-decoration: line-through; color: #a8a29e; }
  .subtask .delete-x { opacity: 0; color: #a8a29e; }
  .subtask:hover .delete-x { opacity: 1; }
  .subtask .delete-x:hover { color: #be123c; }
  .add-subtask {
    margin-top: 8px; display: flex; align-items: center; gap: 8px;
  }
  .add-subtask input {
    flex: 1; font-size: 13px; background: transparent;
    border: none; border-bottom: 1px solid #e7e5e4; padding: 4px 0;
  }
  .add-subtask input:focus { border-bottom-color: #a8a29e; }

  /* drag visual */
  .drop-target { background: rgba(180, 83, 9, 0.05) !important; }

  /* scrollbar polish */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Polished scrollbars inside day columns and backlog */
  .day-tasks::-webkit-scrollbar,
  aside.backlog::-webkit-scrollbar { width: 6px; }
  .day-tasks::-webkit-scrollbar-thumb,
  aside.backlog::-webkit-scrollbar-thumb {
    background: transparent;
    border-radius: 3px;
    transition: background 0.2s;
  }
  .day-col:hover .day-tasks::-webkit-scrollbar-thumb,
  aside.backlog:hover::-webkit-scrollbar-thumb { background: #d6d3d1; }
  .day-tasks { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .day-col:hover .day-tasks { scrollbar-color: #d6d3d1 transparent; }

  .empty-hint { font-size: 12px; color: #a8a29e; font-style: italic; padding: 24px 4px; text-align: center; }

  /* overdue rollover banner */
  .overdue-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 12px; padding: 10px 14px;
    background: rgba(217, 119, 6, 0.10);
    border: 1px solid rgba(217, 119, 6, 0.35);
    border-radius: 10px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .overdue-text { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #78350f; }
  .overdue-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 6px;
    background: #b45309; color: white; border-radius: 999px;
    font-weight: 600; font-size: 12px;
  }
  .overdue-actions { display: flex; align-items: center; gap: 6px; }
  .overdue-actions .pill { border-color: rgba(180, 83, 9, 0.4); color: #78350f; }
  .overdue-actions .pill:hover { background: white; }

  /* drop slots between tasks for reordering */
  .day-tasks { gap: 0; }
  .drop-slot {
    height: 6px;
    margin: 0;
    border-radius: 3px;
    transition: height 0.12s, background 0.12s, margin 0.12s;
  }
  .drop-slot.drop-active {
    height: 24px;
    margin: 4px 0;
    background: rgba(180, 83, 9, 0.18);
    border: 1px dashed rgba(180, 83, 9, 0.55);
  }
  /* keep some breathing room between cards even without active drop */
  .day-tasks > .task,
  .backlog .task { margin-bottom: 0; }
  .day-tasks > .task + .drop-slot,
  .backlog .task + .drop-slot { margin-top: 0; }

  /* completed section */
  .done-divider {
    margin: 12px 4px 6px;
    display: flex; align-items: center; gap: 8px;
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.22em;
    color: #a8a29e;
  }
  .done-divider span { white-space: nowrap; }
  .done-divider::before, .done-divider::after {
    content: ""; flex: 1; height: 1px; background: #e7e5e4;
  }
  .done-list { display: flex; flex-direction: column; gap: 6px; }
  .done-list .task { background: rgba(255,255,255,0.6); }

  @media (max-width: 900px) {
    .week-grid { grid-template-columns: repeat(var(--day-count, 5), minmax(140px, 1fr)); overflow-x: auto; }
    aside.backlog, aside.detail { width: 260px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// =============================================================
//  THE WEEKLY PLANNER — single-file vanilla JS edition
//  Data is saved to localStorage under key "planner-state-v1".
//  To reset: open devtools console and run localStorage.clear()
// =============================================================

// ---------- constants ----------
const PRIORITIES = {
  high: { label: "High", dot: "#e11d48", bg: "rgba(225,29,72,0.10)" },
  med:  { label: "Medium", dot: "#d97706", bg: "rgba(217,119,6,0.10)" },
  low:  { label: "Low", dot: "#0891b2", bg: "rgba(8,145,178,0.10)" },
};
const FLAGS = {
  work:     { label: "Work",     dot: "#0f766e", bg: "rgba(15,118,110,0.10)" },
  personal: { label: "Personal", dot: "#9333ea", bg: "rgba(147,51,234,0.10)" },
};
const PROJECT_COLORS = ["#0f766e","#7c3aed","#be185d","#1d4ed8","#b45309","#15803d","#9333ea"];
const RECUR_OPTIONS = [
  { value: "none", label: "Doesn't repeat" },
  { value: "daily", label: "Every weekday" },
  { value: "weekly", label: "Weekly" },
];
const DAY_HOURS = Array.from({ length: 24 }, (_, i) => i); // 0..23
const SLOT_PX = 56;
const TIMELINE_VISIBLE_PX = 560; // ~10 hour rows visible
const TIMELINE_DEFAULT_SCROLL_HOUR = 8; // initial scroll target
const STORAGE_KEY = "planner-state-v1";

// ---------- helpers ----------
const uid = () => Math.random().toString(36).slice(2, 10);
const startOfDay = (date) => {
  const d = new Date(date); d.setHours(0,0,0,0); return d;
};
const addDays = (date, n) => { const d = new Date(date); d.setDate(d.getDate() + n); return d; };
const isoDay = (date) => {
  const d = new Date(date); d.setHours(0,0,0,0);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
};
const fmtDayShort = (d) => d.toLocaleDateString(undefined, { weekday: "short" });
const fmtDayNum = (d) => d.getDate();
const fmtRange = (start, count) => {
  const end = addDays(start, count - 1);
  const sameMonth = start.getMonth() === end.getMonth();
  const sameYear = start.getFullYear() === end.getFullYear();
  const opts = { month: "short", day: "numeric" };
  if (sameMonth) {
    return `${start.toLocaleDateString(undefined, opts)} – ${end.getDate()}, ${end.getFullYear()}`;
  }
  if (sameYear) {
    return `${start.toLocaleDateString(undefined, opts)} – ${end.toLocaleDateString(undefined, opts)}, ${end.getFullYear()}`;
  }
  return `${start.toLocaleDateString(undefined, { ...opts, year: "numeric" })} – ${end.toLocaleDateString(undefined, { ...opts, year: "numeric" })}`;
};
const formatHour = (h) => {
  const whole = Math.floor(h);
  const min = Math.round((h - whole) * 60);
  const ampm = whole >= 12 ? "pm" : "am";
  const display = ((whole + 11) % 12) + 1;
  return min === 0 ? `${display}${ampm}` : `${display}:${String(min).padStart(2,"0")}${ampm}`;
};
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- icons (inline SVG) ----------
const ICON = {
  plus:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  chevL:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chevR:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  chevLL:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18l-6-6 6-6"/><path d="M19 18l-6-6 6-6"/></svg>',
  chevRR:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18l6-6-6-6"/><path d="M13 18l6-6-6-6"/></svg>',
  inbox:   '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',

// Parse free-form text like "Email Priya tomorrow 3pm 30m #work !high"
// Returns { title, day, slot, duration, flag, priority } with only matched fields set.
function parseQuickAdd(raw) {
  let s = " " + raw.trim() + " ";
  const out = {};
  const today = startOfDay(new Date());

  // tags
  s = s.replace(/\s#work\b/i, () => { out.flag = "work"; return " "; });
  s = s.replace(/\s#personal\b/i, () => { out.flag = "personal"; return " "; });
  s = s.replace(/\s!high\b/i,   () => { out.priority = "high"; return " "; });
  s = s.replace(/\s!med(ium)?\b/i, () => { out.priority = "med"; return " "; });
  s = s.replace(/\s!low\b/i,    () => { out.priority = "low"; return " "; });

  // dates
  s = s.replace(/\s(today)\b/i, () => { out.day = isoDay(today); return " "; });
  s = s.replace(/\s(tomorrow|tmrw)\b/i, () => { out.day = isoDay(addDays(today, 1)); return " "; });
  const weekdays = ["sun","mon","tue","wed","thu","fri","sat"];
  weekdays.forEach((w, idx) => {
    const re = new RegExp(`\\s(${w}|${w}day|${["sunday","monday","tuesday","wednesday","thursday","friday","saturday"][idx]})\\b`, "i");
    s = s.replace(re, () => {
      // find next occurrence of that weekday (including today)
      let d = new Date(today);
      while (d.getDay() !== idx) d = addDays(d, 1);
      out.day = isoDay(d);
      return " ";
    });
  });

  // times like "3pm", "9:30am", "14:00"
  s = s.replace(/\s(\d{1,2})(?::(\d{2}))?\s?(am|pm)\b/i, (_, h, m, ap) => {
    let hour = parseInt(h, 10);
    if (ap.toLowerCase() === "pm" && hour < 12) hour += 12;
    if (ap.toLowerCase() === "am" && hour === 12) hour = 0;
    if (m) hour += parseInt(m, 10) / 60;
    out.slot = Math.max(0, Math.min(23.75, Math.round(hour * 4) / 4));
    return " ";
  });
  s = s.replace(/\s(\d{1,2}):(\d{2})\b/, (_, h, m) => {
    if (out.slot != null) return _; // already matched
    const hour = parseInt(h, 10) + parseInt(m, 10) / 60;
    out.slot = Math.max(0, Math.min(23.75, Math.round(hour * 4) / 4));
    return " ";
  });

  // duration like "1h", "30m", "1.5h"
  s = s.replace(/\s(\d+(?:\.\d+)?)h\b/i, (_, n) => { out.duration = parseFloat(n); return " "; });
  s = s.replace(/\s(\d+)m(in)?\b/i, (_, n) => { out.duration = Math.max(0.25, parseInt(n,10) / 60); return " "; });

  out.title = s.replace(/\s+/g, " ").trim();
  if (!out.title) delete out.title;
  return out;
}

// ---------- mutations ----------
function nextOrder(dayKey) {
  // returns max order + 1 within a bucket (day === dayKey, including null for backlog)
  const inBucket = state.tasks.filter(t => t.day === dayKey);
  if (inBucket.length === 0) return 0;
  return Math.max(...inBucket.map(t => t.order ?? 0)) + 1;
}

function updateTask(id, patch) {
  state.tasks = state.tasks.map(t => t.id === id ? { ...t, ...patch } : t);
  saveState(); render();
}
function removeTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  if (selectedTaskId === id) selectedTaskId = null;
  saveState(); render();
}
function addTask(partial) {
  const day = partial.day ?? null;
  const t = {
    id: uid(),
    title: partial.title || "Untitled task",
    notes: "", priority: "med", project: "",
    projectColor: PROJECT_COLORS[Math.floor(Math.random() * PROJECT_COLORS.length)],
    recur: "none", day, slot: partial.slot ?? null,
    duration: partial.duration ?? 0.5, done: false,
    order: nextOrder(day),
    flag: null, // "work" | "personal" | null
    subtasks: [],
    ...partial,
  };
  state.tasks.push(t); saveState(); render();
  return t.id;
}

// Reorder: place dragged task at `index` within the active (not-done) list of dayKey.
// `index` is the 0-based position in the active list AFTER removal of the dragged item.
function reorderInDay(taskId, dayKey, index) {
  const dragged = state.tasks.find(t => t.id === taskId);
  if (!dragged) return;
  const movingDay = dragged.day !== dayKey;

  // Active tasks currently in target day, sorted, EXCLUDING the dragged one
  const active = state.tasks
    .filter(t => t.day === dayKey && !t.done && t.id !== taskId)
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

  const clamped = Math.max(0, Math.min(index, active.length));
  // Reassign sequential order values to active list with dragged inserted at position
  const newActive = [...active.slice(0, clamped), dragged, ...active.slice(clamped)];
  newActive.forEach((t, i) => {
    if (t.id === taskId) {
      t.day = dayKey;
      t.order = i;
      if (movingDay) t.slot = null; // moving to a new day clears time-box
    } else {
      t.order = i;
    }
  });
  // Done tasks keep their relative order but get pushed after active
  const done = state.tasks
    .filter(t => t.day === dayKey && t.done && t.id !== taskId)
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
  done.forEach((t, i) => { t.order = newActive.length + i; });

  saveState(); render();
}

// Find tasks scheduled for past days that aren't completed
function findOverdueTasks() {
  const todayKey = isoDay(new Date());
  return state.tasks.filter(t => !t.done && t.day && t.day < todayKey);
}

function rollOverdueForward() {
  const todayKey = isoDay(new Date());
  const overdue = findOverdueTasks();
  if (overdue.length === 0) return;
  const baseOrder = nextOrder(todayKey);
  overdue.forEach((t, i) => {
    t.day = todayKey;
    t.slot = null;
    t.order = baseOrder + i;
  });
  prefs.overdueDismissedFor = todayKey;
  savePrefs();
  saveState(); render();
}

function dismissOverdueBanner() {
  prefs.overdueDismissedFor = isoDay(new Date());
  savePrefs();
  render();
}

  `).join("") + `<div class="drop-slot" data-drop="reorder" data-day="null" data-index="${active.length}"></div>`;

  return `

             ` : ""}`}

  `;
}

function renderTimeline(date, tasks) {
  const scheduled = tasks.filter(t => t.slot != null && !t.done);
  const unscheduled = tasks.filter(t => t.slot == null && !t.done);
  const totalH = DAY_HOURS.length * SLOT_PX;

  // Show "now" line if we're looking at today
  const now = new Date();
  const isToday = isoDay(date) === isoDay(now);
  const nowFraction = isToday
    ? now.getHours() + now.getMinutes() / 60
    : null;
  const nowTop = nowFraction != null ? nowFraction * SLOT_PX : null;

  return `
    <section class="timeline">
      <div class="timeline-head">
        <div>
          <div class="uppercase-label">Time-box</div>
          <div class="timeline-title">${escapeHtml(date.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" }))}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end">
          ${unscheduled.length > 0 ? `

              <span class="uppercase-label">Unscheduled →</span>
              ${unscheduled.map(t => `
                <div class="pill-task" draggable="true" data-task-id="${t.id}" title="Drag onto a time slot">${escapeHtml(t.title)}</div>
              `).join("")}
            </div>
          ` : ""}
          ${isToday ? `<button class="pill" data-action="scroll-to-now" title="Scroll to current time">Now</button>` : ""}
        </div>
      </div>
      <div class="timeline-body" id="timeline-body">
        <div class="timeline-grid" style="height:${totalH}px">
          ${DAY_HOURS.map((h, i) => `
            <div class="hour-row" data-drop="slot" data-hour="${h}" style="top:${i*SLOT_PX}px;height:${SLOT_PX}px">
              <div class="hour-label">${formatHour(h)}</div>
            </div>
          `).join("")}
          ${nowTop != null ? `
            <div class="now-line" style="top:${nowTop}px">
              <span class="now-dot"></span>
            </div>
          ` : ""}
          ${scheduled.map(t => {
            if (t.slot < DAY_HOURS[0] || t.slot > DAY_HOURS[DAY_HOURS.length - 1]) return "";
            const top = (t.slot - DAY_HOURS[0]) * SLOT_PX;
            const height = Math.max(28, (t.duration || 0.5) * SLOT_PX - 4);
            const p = PRIORITIES[t.priority] || PRIORITIES.med;
            return `
              <div class="event" draggable="true" data-task-id="${t.id}"
                   style="top:${top}px;height:${height}px;border-color:${p.dot}">
                <div class="event-head">
                  <div class="event-title">${escapeHtml(t.title)}</div>
                  <button class="x-btn" data-action="unschedule" data-id="${t.id}" title="Unschedule">${ICON.xs}</button>
                </div>
                <div class="event-meta">
                  ${ICON.clock}<span>${formatHour(t.slot)} · ${t.duration}h</span>
                  ${t.project ? `<span style="display:inline-flex;align-items:center;gap:4px"><span class="dot" style="background:${t.projectColor}"></span>${escapeHtml(t.project)}</span>` : ""}
                </div>
                <div class="resize-handle" data-resize="${t.id}"></div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    </section>
  `;
}

function renderDetail(task) {
  return `
    <aside class="detail">
      <div class="detail-head">
        <div class="uppercase-label">Task</div>
        <div class="detail-actions">
          <button class="icon-btn danger" data-action="delete-task" data-id="${task.id}" title="Delete">${ICON.trash}</button>
          <button class="icon-btn" data-action="close-detail" title="Close">${ICON.x}</button>
        </div>
      </div>

      <input class="detail-title" data-field="title" value="${escapeHtml(task.title)}" />

      <div class="grid-2">
        <label>
          <div class="uppercase-label" style="margin-bottom:4px">Priority</div>
          <select class="field-select" data-field="priority">
            ${Object.entries(PRIORITIES).map(([k,v]) =>
              `<option value="${k}" ${task.priority===k?"selected":""}>${v.label}</option>`).join("")}
          </select>
        </label>
        <label>
          <div class="uppercase-label" style="margin-bottom:4px">Type</div>
          <select class="field-select" data-field="flag">
            <option value="" ${!task.flag ? "selected" : ""}>—</option>
            ${Object.entries(FLAGS).map(([k,v]) =>
              `<option value="${k}" ${task.flag===k?"selected":""}>${v.label}</option>`).join("")}
          </select>
        </label>
        <label>
          <div class="uppercase-label" style="margin-bottom:4px">Duration (h)</div>
          <input class="field-input" type="number" step="0.25" min="0.25" data-field="duration" value="${task.duration ?? 0.5}" />
        </label>
        <label>
          <div class="uppercase-label" style="margin-bottom:4px">Project</div>
          <input class="field-input" data-field="project" value="${escapeHtml(task.project || "")}" placeholder="Add a project…" />
        </label>
        <label>
          <div class="uppercase-label" style="margin-bottom:4px">Project color</div>
          <div class="color-row">
            ${PROJECT_COLORS.map(c => `
              <button class="color-swatch" data-action="set-color" data-color="${c}"
                style="background:${c};border-color:${task.projectColor===c?"#1c1917":"transparent"}"></button>
            `).join("")}
          </div>
        </label>
        <label>
          <div class="uppercase-label" style="margin-bottom:4px">Day</div>
          <input class="field-input" type="date" data-field="day" value="${task.day || ""}" />
        </label>
        <label>
          <div class="uppercase-label" style="margin-bottom:4px">Time</div>
          <select class="field-select" data-field="slot">
            <option value="">Unscheduled</option>
            ${DAY_HOURS.map(h => `<option value="${h}" ${task.slot==h?"selected":""}>${formatHour(h)}</option>`).join("")}
          </select>
        </label>
        <label class="full">
          <div class="uppercase-label" style="margin-bottom:4px">Repeat</div>
          <select class="field-select" data-field="recur">
            ${RECUR_OPTIONS.map(o => `<option value="${o.value}" ${task.recur===o.value?"selected":""}>${o.label}</option>`).join("")}
          </select>
        </label>
      </div>

      <div class="section">
        <div class="section-label">${ICON.note} Notes</div>
        <textarea class="notes" data-field="notes" placeholder="Anything you want to remember…">${escapeHtml(task.notes || "")}</textarea>
      </div>

      <div class="section">
        <div class="section-label">${ICON.list} Subtasks</div>
        <div>
          ${(task.subtasks || []).map(s => `
            <div class="subtask">
              <button class="icon-btn" data-action="toggle-sub" data-id="${s.id}">
                ${s.done ? ICON.squareCk : ICON.square}
              </button>
              <input class="title ${s.done ? "done" : ""}" data-sub="${s.id}" value="${escapeHtml(s.title)}" />
              <button class="delete-x icon-btn" data-action="delete-sub" data-id="${s.id}">${ICON.xs}</button>
            </div>
          `).join("")}
        </div>
        <form class="add-subtask" data-form="add-sub">
          ${ICON.plus}
          <input name="title" placeholder="Add subtask" autocomplete="off" />
        </form>
      </div>
    </aside>
  `;
}

// ---------- event handlers ----------
function attachHandlers() {
  const root = document.getElementById("app");

  // top bar actions
  root.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", (e) => {
      const action = el.getAttribute("data-action");
      const id = el.getAttribute("data-id");

      if (action === "prev-day") { windowStart = addDays(windowStart, -1); render(); }
      else if (action === "next-day") { windowStart = addDays(windowStart, 1); render(); }
      else if (action === "prev-jump") { windowStart = addDays(windowStart, -prefs.daysInView); render(); }
      else if (action === "next-jump") { windowStart = addDays(windowStart, prefs.daysInView); render(); }
      else if (action === "today") { windowStart = startOfDay(new Date()); setActiveDay(isoDay(new Date())); render(); }
      else if (action === "set-days") {
        const n = parseInt(el.getAttribute("data-days"), 10);
        if (n === 5 || n === 7) {
          prefs.daysInView = n;
          savePrefs();
          render();
        }
      }
      else if (action === "toggle-inbox") { showInbox = !showInbox; render(); }
      else if (action === "scroll-to-now") {
        e.stopPropagation();
        const tb = document.getElementById("timeline-body");
        if (tb) {
          const now = new Date();
          const targetHour = Math.max(0, now.getHours() - 1);
          tb.scrollTo({ top: targetHour * SLOT_PX, behavior: "smooth" });
        }
      }
      else if (action === "roll-overdue") { rollOverdueForward(); }
      else if (action === "dismiss-overdue") { dismissOverdueBanner(); }
      else if (action === "toggle-done") {
        e.stopPropagation();
        const t = state.tasks.find(x => x.id === id);
        if (!t.done) {
          // Mark done — push below all currently-done tasks in same bucket
          const sameDayDone = state.tasks.filter(x => x.day === t.day && x.done && x.id !== id);
          const maxDoneOrder = sameDayDone.length > 0 ? Math.max(...sameDayDone.map(x => x.order ?? 0)) : -1;
          updateTask(id, { done: true, order: maxDoneOrder + 1 });
        } else {
          // Un-complete — put back at bottom of active list
          const activeCount = state.tasks.filter(x => x.day === t.day && !x.done && x.id !== id).length;
          updateTask(id, { done: false, order: activeCount });
        }
      }
      else if (action === "unschedule") {
        e.stopPropagation();
        updateTask(id, { slot: null });
      }
      else if (action === "close-detail") { selectedTaskId = null; render(); }
      else if (action === "delete-task") {
        if (confirm("Delete this task?")) removeTask(id);
      }
      else if (action === "set-color") {
        const color = el.getAttribute("data-color");
        updateTask(selectedTaskId, { projectColor: color });
      }
      else if (action === "toggle-inline-sub") {
        e.stopPropagation();
        const taskId = el.getAttribute("data-task");
        const subId = el.getAttribute("data-sub");
        const t = state.tasks.find(x => x.id === taskId);
        if (!t) return;
        const subs = (t.subtasks || []).map(s => s.id === subId ? { ...s, done: !s.done } : s);
        updateTask(taskId, { subtasks: subs });
      }
      else if (action === "toggle-sub") {
        const t = state.tasks.find(x => x.id === selectedTaskId);
        const subs = t.subtasks.map(s => s.id === id ? { ...s, done: !s.done } : s);
        updateTask(selectedTaskId, { subtasks: subs });
      }
      else if (action === "delete-sub") {
        const t = state.tasks.find(x => x.id === selectedTaskId);
        updateTask(selectedTaskId, { subtasks: t.subtasks.filter(s => s.id !== id) });
      }
    });
  });

  // task card click → open detail
  root.querySelectorAll(".task").forEach(el => {
    el.addEventListener("click", (e) => {
      // ignore clicks on the check button (already stopped) — open detail
      if (e.target.closest("[data-action]")) return;
      selectedTaskId = el.getAttribute("data-task-id");
      render();
    });
  });

  // event timeline click → open detail
  root.querySelectorAll(".event").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-action]")) return;
      if (e.target.closest("[data-resize]")) return;
      selectedTaskId = el.getAttribute("data-task-id");
      render();
    });
  });

  // day column click → activate
  root.querySelectorAll(".day-col").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest(".task")) return;
      if (e.target.closest("form")) return;
      setActiveDay(el.getAttribute("data-day"));
      render();
    });
  });

  // forms
  const inboxForm = root.querySelector('[data-form="add-inbox"]');
  if (inboxForm) {
    inboxForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = inboxForm.title.value.trim();
      if (!v) return;
      const parsed = parseQuickAdd(v);
      // backlog form: parsed day (if any) overrides null
      addTask({ day: parsed.day ?? null, ...parsed });
    });
  }
  root.querySelectorAll('[data-form="add-day"]').forEach(form => {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = form.title.value.trim();
      if (!v) return;
      const parsed = parseQuickAdd(v);
      const day = parsed.day ?? form.getAttribute("data-day");
      addTask({ ...parsed, day });
    });
  });
  const subForm = root.querySelector('[data-form="add-sub"]');
  if (subForm) {
    subForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = subForm.title.value.trim();
      if (!v) return;
      const t = state.tasks.find(x => x.id === selectedTaskId);
      updateTask(selectedTaskId, { subtasks: [...(t.subtasks || []), { id: uid(), title: v, done: false }] });
    });
  }

  // detail field changes
  root.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("change", () => commitField(el));
    if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
      el.addEventListener("blur", () => commitField(el));
    }
  });
  root.querySelectorAll("[data-sub]").forEach(el => {
    el.addEventListener("blur", () => {
      const subId = el.getAttribute("data-sub");
      const t = state.tasks.find(x => x.id === selectedTaskId);
      const subs = t.subtasks.map(s => s.id === subId ? { ...s, title: el.value } : s);
      updateTask(selectedTaskId, { subtasks: subs });
    });
  });

  // Prevent interactive child elements from initiating a card drag
  root.querySelectorAll(".inline-sub-check, .check").forEach(el => {
    el.addEventListener("mousedown", (e) => e.stopPropagation());
    el.setAttribute("draggable", "false");
  });

  // drag and drop
  root.querySelectorAll("[data-task-id]").forEach(el => {
    el.addEventListener("dragstart", (e) => {
      // Don't start drag if user is interacting with a checkbox/sub-checkbox
      if (e.target.closest(".inline-sub-check, .check")) { e.preventDefault(); return; }
      dragId = el.getAttribute("data-task-id");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", dragId); } catch (_) {}
    });
    el.addEventListener("dragend", () => { dragId = null; });
  });

  root.querySelectorAll('[data-drop="day"]').forEach(el => {
    el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("drop-target"); });
    el.addEventListener("dragleave", () => el.classList.remove("drop-target"));
    el.addEventListener("drop", (e) => {
      e.preventDefault(); el.classList.remove("drop-target");
      if (!dragId) return;
      // Day-level drop = append to bottom of active list for that day
      const day = el.getAttribute("data-day");
      const activeCount = state.tasks.filter(t => t.day === day && !t.done && t.id !== dragId).length;
      reorderInDay(dragId, day, activeCount);
      dragId = null;
    });
  });

  // Reorder drop slots (between cards within a day or backlog)
  root.querySelectorAll('[data-drop="reorder"]').forEach(el => {
    el.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.stopPropagation();
      el.classList.add("drop-active");
    });
    el.addEventListener("dragleave", () => el.classList.remove("drop-active"));
    el.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation(); // prevent the parent day-drop from also firing
      el.classList.remove("drop-active");
      if (!dragId) return;
      const dayAttr = el.getAttribute("data-day");
      const day = dayAttr === "null" ? null : dayAttr;
      const index = parseInt(el.getAttribute("data-index"), 10);
      reorderInDay(dragId, day, index);
      dragId = null;
    });
  });

  const inboxEl = root.querySelector('[data-drop="inbox"]');
  if (inboxEl) {
    inboxEl.addEventListener("dragover", (e) => { e.preventDefault(); });
    inboxEl.addEventListener("drop", (e) => {
      e.preventDefault();
      if (!dragId) return;
      const activeCount = state.tasks.filter(t => t.day === null && !t.done && t.id !== dragId).length;
      reorderInDay(dragId, null, activeCount);
      dragId = null;
    });
  }

  root.querySelectorAll('[data-drop="slot"]').forEach(el => {
    el.addEventListener("dragover", (e) => { e.preventDefault(); el.style.background = "rgba(180,83,9,0.06)"; });
    el.addEventListener("dragleave", () => { el.style.background = ""; });
    el.addEventListener("drop", (e) => {
      e.preventDefault();
      el.style.background = "";
      if (!dragId) return;
      const hour = parseFloat(el.getAttribute("data-hour"));
      updateTask(dragId, { day: activeDayKey, slot: hour });
      dragId = null;
    });
  });

  // resize handles
  root.querySelectorAll("[data-resize]").forEach(handle => {
    handle.addEventListener("mousedown", (e) => {
      e.stopPropagation(); e.preventDefault();
      const id = handle.getAttribute("data-resize");
      const t = state.tasks.find(x => x.id === id);
      const startY = e.clientY;
      const startDur = t.duration || 0.5;
      let newDur = startDur;
      const move = (ev) => {
        const dy = ev.clientY - startY;
        newDur = Math.max(0.25, Math.round((startDur + dy / SLOT_PX) * 4) / 4);
        // visual update
        const eventEl = handle.closest(".event");
        if (eventEl) eventEl.style.height = Math.max(28, newDur * SLOT_PX - 4) + "px";
      };
      const up = () => {
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
        if (newDur !== startDur) updateTask(id, { duration: newDur });
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    });
  });
}

function commitField(el) {
  if (!selectedTaskId) return;
  const field = el.getAttribute("data-field");
  let val = el.value;
  if (field === "duration") val = parseFloat(val) || 0.5;
  else if (field === "slot") val = val === "" ? null : parseFloat(val);
  else if (field === "day") val = val || null;
  else if (field === "flag") val = val || null;
  updateTask(selectedTaskId, { [field]: val });
}

// ---------- boot ----------
state = loadState();

// Always start with today as the leftmost column on load
function snapToToday() {
  windowStart = startOfDay(new Date());
  activeDayKey = isoDay(new Date());
}
snapToToday();
render();

// Re-snap when the tab regains focus or becomes visible (handles overnight tabs)
function maybeSnap() {
  const todayKey = isoDay(new Date());
  // Only auto-snap if we're not already centered on today; otherwise let the user
  // browse other days without getting yanked back.
  if (isoDay(windowStart) !== todayKey) {
    snapToToday();
    render();
  }
}
window.addEventListener("focus", maybeSnap);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) maybeSnap();
});

// Schedule a re-snap shortly after midnight so an always-open tab rolls over
function scheduleMidnightRollover() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(24, 0, 5, 0); // 00:00:05 tomorrow
  setTimeout(() => {
    snapToToday();
    render();
    scheduleMidnightRollover();
  }, next - now);
}
scheduleMidnightRollover();

// Keyboard shortcuts. Skip while user is typing in a text field.
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
  if (el.isContentEditable) return true;
  return false;
}

window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (isTypingTarget(e.target)) {
    // Only Esc works inside inputs (to blur or close the detail panel)
    if (e.key === "Escape") {
      e.target.blur();
      if (selectedTaskId) { selectedTaskId = null; render(); }
    }
    return;
  }

  if (e.key === "Escape") {
    if (selectedTaskId) { selectedTaskId = null; render(); }
    return;
  }
  if (e.key === "t" || e.key === "T") {
    windowStart = startOfDay(new Date());
    setActiveDay(isoDay(new Date()));
    render();
    e.preventDefault();
    return;
  }
  if (e.key === "ArrowLeft") {
    windowStart = addDays(windowStart, -1);
    render();
    e.preventDefault();
    return;
  }
  if (e.key === "ArrowRight") {
    windowStart = addDays(windowStart, 1);
    render();
    e.preventDefault();
    return;
  }
  if (e.key === "n" || e.key === "N") {
    // Focus the "+ Task" input for the active day (or the backlog input if it's open)
    const form = document.querySelector(`[data-form="add-day"][data-day="${activeDayKey}"]`)
      || document.querySelector('[data-form="add-inbox"]');
    if (form) {
      const input = form.querySelector("input");
      if (input) { input.focus(); e.preventDefault(); }
    }
    return;
  }
});
